# build.yml | Author: klahack | MIT License
name: Build, test, and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source
        run: python -m py_compile klahack_portscope.py tests/test_klahack_portscope.py tests/ci_runner.py
      - name: Run loopback-only tests
        run: python tests/ci_runner.py

  build:
    name: Build ${{ matrix.artifact }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: klahack-portscope-linux-x64
            source: dist/klahack-portscope
          - os: macos-latest
            artifact: klahack-portscope-macos
            source: dist/klahack-portscope
          - os: windows-latest
            artifact: klahack-portscope-windows.exe
            source: dist/klahack-portscope.exe
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned build dependency
        run: python -m pip install --disable-pip-version-check pyinstaller==6.10.0
      - name: Build standalone executable
        run: python -m PyInstaller --onefile --name klahack-portscope klahack_portscope.py
      - name: Stage named artifact
        shell: python
        env:
          BUILD_SOURCE: ${{ matrix.source }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          import os
          import pathlib
          import shutil
          output = pathlib.Path("release-assets")
          output.mkdir(exist_ok=True)
          shutil.copy2(os.environ["BUILD_SOURCE"], output / os.environ["ARTIFACT_NAME"])
      - name: Upload standalone executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download built executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate release checksums
        run: |
          cp klahack_portscope.py release-assets/klahack_portscope.py
          cd release-assets
          sha256sum \
            klahack_portscope.py \
            klahack-portscope-linux-x64 \
            klahack-portscope-macos \
            klahack-portscope-windows.exe > SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --generate-notes --title "$TAG"
          fi
